spring:
  application:
    name: finshield
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:                      # runtime: least-privilege role
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/finshield}
    username: ${SPRING_DATASOURCE_USERNAME:finshield_app}
    password: ${SPRING_DATASOURCE_PASSWORD:app_dev_pw}
  flyway:                          # migrations: owner role, separate connection
    url: ${SPRING_FLYWAY_URL:${spring.datasource.url}}
    user: ${SPRING_FLYWAY_USER:finshield_owner}
    password: ${SPRING_FLYWAY_PASSWORD:owner_dev_pw}
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

finshield:
  jwt:
    secret: ${FINSHIELD_JWT_SECRET:dev-only-local-secret-do-not-use-in-prod-0123456789}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}