name: OWASP ZAP Security Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/src/**'
      - 'zap/**'
      - 'docker-compose.yml'

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write        # ZAP action may open issues for findings

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ── start the database ──────────────────────────────────────────────────
      - name: Start Postgres
        run: docker compose up -d db

      - name: Wait for Postgres
        run: |
          timeout 30 bash -c \
            'until docker compose exec db pg_isready -U postgres; do sleep 2; done'

      # ── build and start the app ─────────────────────────────────────────────
      - name: Build Spring Boot app
        run: ./mvnw -q package -DskipTests
        working-directory: backend

      - name: Start Spring Boot app
        run: |
          java -jar backend/target/finshield-*.jar &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
        env:
          FINSHIELD_JWT_SECRET: ci-only-jwt-secret-not-for-production-use-00000

      - name: Wait for app health check
        run: |
          timeout 60 bash -c \
            'until curl -sf http://localhost:8080/actuator/health | grep -q "UP"; do sleep 3; done'

      # ── ZAP baseline scan ───────────────────────────────────────────────────
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: 'zap/zap-rules.tsv'
          cmd_options: '-a -j'
          allow_issue_writing: false

      # ── upload report regardless of scan outcome ────────────────────────────
      - name: Upload ZAP HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-${{ github.run_number }}
          path: report_html.html
          retention-days: 30

      - name: Stop app
        if: always()
        run: kill "$APP_PID" || true
