services:
  db:
    image: postgres:16
    container_name: finshield-db
    environment:
      POSTGRES_DB: finshield
      POSTGRES_USER: postgres          
      POSTGRES_PASSWORD: postgres_admin_dev
    ports:
      - "5433:5432"                    
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata: